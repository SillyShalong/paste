name: Windows · Build & Release

# Development happens on dev; merging dev into main and pushing is the
# "ship it" signal — every main push builds the app. Version tags
# additionally publish a formal Release. dev pushes do not build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    # For a commit pushed together with a release tag, include [tag-build]
    # in its subject to let the tag run perform the build once.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[tag-build]')
    runs-on: windows-latest
    permissions:
      contents: write # needed only when attaching a release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: npm run typecheck && npm test

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (release)
        run: npx tauri build

      # Every push to main produces downloadable build artifacts.
      - name: Package portable zip
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/paste.exe Paste.exe
          Compress-Archive -Path Paste.exe -DestinationPath "Paste_${{ github.ref_name }}_x64-portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paste-windows-x64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Paste_*_x64-portable.zip

      # Pushing a tag like v0.1.0 additionally publishes a GitHub Release
      # with the installer attached.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Paste_*_x64-portable.zip
          generate_release_notes: true
