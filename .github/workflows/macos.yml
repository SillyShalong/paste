name: Validate native window probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only native probe
        shell: pwsh
        run: |
          $script = Get-Content -Raw scripts/probe-white-strip.ps1
          & ([scriptblock]::Create($script)) -DelaySeconds 0
