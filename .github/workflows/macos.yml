name: Validate native window probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only native probe
        shell: pwsh
        run: |
          trap {
            $message = ($_ | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error::$message"
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'Paste'
          $form.Width = 800
          $form.Height = 600
          $form.Show()
          [System.Windows.Forms.Application]::DoEvents()
          $script = Get-Content -Raw scripts/probe-white-strip.ps1
          try {
            $output = & ([scriptblock]::Create($script)) -DelaySeconds 0 -ProcessName pwsh
            $report = $output | ConvertFrom-Json
            $json = $output -join "`n"
            $encoded = $json -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::notice::$encoded"
            if (-not $report.panel.visible -or $null -eq $report.footer -or $null -eq $report.cards) {
              throw 'Automatic panel sampling failed'
            }
            $output
          } finally { $form.Dispose() }
      - name: Validate read-only runtime inspection
        shell: pwsh
        run: |
          $script = Get-Content -Raw scripts/inspect-webview-runtime.ps1
          $report = & ([scriptblock]::Create($script)) | ConvertFrom-Json
          if (-not $report.windows) { throw 'Windows version missing' }
