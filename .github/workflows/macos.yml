name: macOS · Test, Build & Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  windows-panel-ui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: Exercise native panel and record rendering
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/panel-tools" --no-save playwright-core@1.56.1
          $env:PLAYWRIGHT_CORE_PATH = "$env:RUNNER_TEMP/panel-tools/node_modules/playwright-core"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $env:PASTE_UI_TEST = '1'
          Start-Process src-tauri/target/debug/paste.exe -RedirectStandardOutput ui-stdout.log -RedirectStandardError ui-stderr.log
          Start-Sleep -Seconds 5
          1..12 | ForEach-Object { Set-Clipboard "Native panel test card $_"; Start-Sleep -Milliseconds 150 }
          node scripts/check-windows-panel.cjs
      - name: Report native diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($p in @('ui-stderr.log','ui-results/bounds.json')) {
            if (Test-Path $p) {
              $s = (Get-Content -Raw $p) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Output "::notice::$p $s"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-panel-rendering
          path: |
            ui-results/
            ui-*.log

  # Fast regression net for both platforms: typecheck + unit tests.
  check-windows:
    # Release commits marked [tag-build] are checked by the tag run instead.
    if: github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[tag-build]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # macos-15 runners use Apple Silicon. This is the only way to compile
  # the macOS backend without owning a Mac — it type-checks macos.rs and the
  # whole cfg(target_os = "macos") tree against the real target.
  check-macos:
    if: github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[tag-build]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust check (aarch64-apple-darwin)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

  # Full macOS app bundle, on demand or on version tags.
  build-macos:
    needs: [check-windows, check-macos]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build macOS app (aarch64)
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg
      # Re-sign with a requirement keyed to the bundle identifier: Tauri's
      # ad-hoc signature binds the TCC accessibility grant to the exact
      # binary cdhash, so an updated download would silently lose the
      # "Privacy & Security → Accessibility" approval pasting needs.
      - name: Stable-sign the app bundle
        run: ./scripts/codesign-stable.sh src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Paste.app
      - name: Zip the .app bundle
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          safe_ref="${GITHUB_REF_NAME//\//-}"
          zip -q -r -y "Paste_${safe_ref}_aarch64.app.zip" Paste.app
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paste-macos-aarch64-${{ github.run_number }}
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.zip

      # Tags additionally publish the .dmg + .app zip on a GitHub Release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.zip
          generate_release_notes: true
