[package]
name = "paste"
version = "0.6.10"
description = "Paste — a clipboard history app (clone of Paste for Mac) for Windows"
authors = ["paste-clone"]
edition = "2021"

# lib name differs from package name so the cdylib/staticlib artifacts
# (paste.dll / paste.lib) don't collide with the exe (paste.exe) on Windows
[lib]
name = "paste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
sys-locale = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ammonia = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Security",
] }

# macOS (Apple Silicon) needs no extra crates: the ObjC interop in
# src/macos.rs uses raw objc_msgSend / CoreGraphics extern declarations
# against the system frameworks (libobjc is auto-linked).

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
